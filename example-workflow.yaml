title: Weekly research digest
description: Collect, summarize, human-review, then publish — a classic durable pipeline
steps:
  - name: gather
    instruction: >
      Search recent sources (last 7 days) for the highest-signal items
      related to the current research theme. Prefer primary sources.
  - name: summarize
    instruction: >
      Write a concise, neutral bullet-point summary for each collected item.
      Include title, source, date, and 2–3 key takeaways.
  - name: human-review
    instruction: >
      Present the draft digest for human approval before any publishing step.
    needs_approval: true
  - name: publish
    instruction: >
      Publish the approved digest to the configured destination
      (Telegram channel, email, Notion page, etc.).
